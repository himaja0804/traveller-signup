
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Destinations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Explore Destinations</h1>
        <p>Discover beautiful places around the world</p>
    </header>

    <main>
        <p id="loading" role="status">Loading destinations...</p>

        <div id="error" role="alert" hidden>
            <p>Unable to load destinations. Please try again.</p>
        </div>

        <button id="retry" hidden>Retry</button>

        <p id="empty" hidden>
            No destinations available.
        </p>

        <section id="destination-list"
                 class="destination-container">
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
