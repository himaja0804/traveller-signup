
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveller Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Traveller Sign Up</h1>
        <p>Register here to plan your next journey!</p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name"
                       required minlength="3">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter 10-digit phone number"
                       pattern="[0-9]{10}"
                       required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label for="destination">Travel Destination</label>
                <select id="destination" name="destination" required>
                    <option value="">Select Destination</option>
                    <option value="Goa">Goa</option>
                    <option value="Manali">Manali</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Hyderabad">Hyderabad</option>
                </select>
            </div>

            <div class="form-group">
                <label for="travellers">Number of Travellers</label>
                <input type="number" id="travellers"
                       name="travellers" min="1" max="10" required>
            </div>

            <div class="form-group">
                <label for="traveldate">Travel Date</label>
                <input type="date" id="traveldate"
                       name="traveldate" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       name="password" minlength="8" required>
            </div>

            <button type="submit">Sign Up</button>

        </form>
    </main>

</body>
</html>
